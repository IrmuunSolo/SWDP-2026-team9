name: CampusFind CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: CampusFind checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: labs/lab07

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm ci

      - name: Test
        run: |
          npm run check
          npm test