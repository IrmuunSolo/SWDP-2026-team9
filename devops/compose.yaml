services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: campusfind
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: campusfind
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - campusfind_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campusfind -d campusfind']
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
volumes:
  campusfind_pg:
